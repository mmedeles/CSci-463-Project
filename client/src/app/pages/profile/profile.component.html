<div class="profile-container">
  <div class="profile-card">
    <h2>👤 My Profile</h2>
    <p class="username-label">Logged in as: <strong>{{ username }}</strong></p>

    <div class="button-group">
      <button class="btn primary" routerLink="/change-password">Change Password</button>
      <button class="btn warning" (click)="logout()">Logout</button>
      <button class="btn danger" (click)="deleteAccount()">Delete Account</button>
    </div>
  </div>
</div>
