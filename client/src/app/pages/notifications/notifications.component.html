<app-header></app-header>
<div class="notifications-wrapper">
  <div class="filter-bar">
    <label for="filter">Filter</label>
    <select id="filter" [(ngModel)]="selectedFilter" (change)="filterNotifications()">
      <option *ngFor="let option of filterOptions" [value]="option">{{ option }}</option>
    </select>
  </div>

  <div class="notification-section" *ngFor="let group of groupedNotifications">
    <h3 class="section-title">{{ group.label }}</h3>
    <div class="notification-card" *ngFor="let item of group.entries">
      <p class="notification-title">{{ item.title }}</p>
      <p class="notification-time">{{ item.time }} — {{ item.model }}</p>
    </div>
  </div>
</div>
