<div class="auth-container">
  <h2 class="auth-title">Register</h2>

  <form (submit)="register()" class="auth-form">
    <label for="username">Username</label>
    <input id="username" type="text" [(ngModel)]="username" name="username" required />

    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" required />

    <button type="submit" class="auth-btn">Register</button>
  </form>

  <div *ngIf="success" class="success-message">✅ Registration successful</div>
  <div *ngIf="!success && message" class="error-message">❌ {{ message }}</div>
</div>
