
<div class="auth-container">
  <h2 class="auth-title">Login</h2>

  <form (submit)="login()" class="auth-form">
    <label for="username">Username</label>
    <input id="username" type="text" [(ngModel)]="username" name="username" required />

    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="password" name="password" required />

    <button type="submit" class="auth-btn">Login</button>
  </form>

  <div *ngIf="success" class="success-message">{{ message }}</div>
  <div *ngIf="!success && message" class="error-message">{{ message }}</div>
</div>
