<app-header></app-header>

<div class="mobile-container">
  <div class="home-wrapper">
    <h2 class="welcome-text">Welcome back,<br />{{ username }}</h2>

    <img
      src="images/car.png"
      alt="Car image"
      [class.active]="engineOn"
      class="car-image"
    />

    <button
      class="start-button"
      [class.active]="engineOn"
      (click)="toggleEngine()"
    >
      <img src="images/start_button.png" alt="Power Icon" class="power-icon" />
    </button>

    <div class="status-card">
      <div class="label">VEHICLE STATUS</div>
      <div class="value">65°F</div>
    </div>

    <div class="status-card">
      <div class="label">LOCKS</div>
      <button class="lock-icon" *ngIf="doorsLocked" (click)="toggleLock()"><img src="images/lock.jpg" alt="lock icon"></button>
      <button class="unlock-icon" *ngIf="!doorsLocked" (click)="toggleLock()"><img src="images/unlock.jpg" alt="unlock icon"></button>
    </div>

    <div class="status-card">
      <div class="label">LOCATION</div>
      <div class="value">1234 Elm St.</div>
    </div>
  </div>
</div>

<app-footer></app-footer>
