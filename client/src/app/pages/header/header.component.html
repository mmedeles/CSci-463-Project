<div class="mobile-container">
  <div class="header">
    <img
      src="https://cdn-icons-png.flaticon.com/512/1828/1828859.png"
      alt="Menu"
      class="icon menu-icon"
      (click)="toggleMenu()"
    />

    <h1 class="title">Remote Start</h1>

    <img
      src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
      alt="Profile"
      class="icon profile-icon"
      (click)="goToProfile()"
    />
  </div>

  <!-- Sidebar Navigation -->
  <div class="sidebar" [class.open]="isOpen">
    <ul>
      <li
        [class.active]="isActive('/profile')"
        (click)="handleClick('/profile')"
      >
        My Profile
      </li>
      <li
        [class.active]="isActive('/home')"
        (click)="handleClick('/home')"
      >
        Home
      </li>
      <li
        [class.active]="isActive('/vehicle-management')"
        (click)="handleClick('/vehicle-management')"
      >
        Vehicle Management
      </li>
      <li
        [class.active]="isActive('/driver-management')"
        (click)="handleClick('/driver-management')"
      >
        Driver Management
      </li>
      <li
        [class.active]="isActive('/notifications')"
        (click)="handleClick('/notifications')"
      >
        Notifications
      </li>
    </ul>
  </div>

  <div class="overlay" *ngIf="isOpen" (click)="toggleMenu()"></div>
</div>
