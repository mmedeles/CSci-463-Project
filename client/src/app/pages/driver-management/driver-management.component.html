<div class="driver-management-container">
  <h2>👥 Driver Management</h2>

  <div class="driver-list">
    <div *ngFor="let driver of drivers" class="driver-card">
      <div class="driver-info">
        <strong>{{ driver.name }}</strong><br />
        <span class="email">{{ driver.email }}</span>
      </div>
      <button class="delete" (click)="deleteDriver(driver)">🗑️</button>
    </div>
  </div>

  <form (ngSubmit)="addDriver()" class="add-driver-form">
    <input type="text" placeholder="Driver Name" [(ngModel)]="newDriver.name" name="name" required />
    <input type="email" placeholder="Driver Email" [(ngModel)]="newDriver.email" name="email" required />
    <button type="submit">➕ Add New Driver</button>
  </form>
</div>
