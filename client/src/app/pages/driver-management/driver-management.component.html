<app-header></app-header>
<div class="mobile-page">
  <h2 class="section-title">Driver Management</h2>

  <div class="driver-card" *ngFor="let driver of drivers">
    <div class="driver-info">
      <p class="driver-name">{{ driver.name }}</p>
      <p class="driver-email">{{ driver.email }}</p>
    </div>
  </div>

  <div class="add-driver" (click)="addDriver()">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" alt="Add" />
    <span>Add New Driver</span>
  </div>
</div>
